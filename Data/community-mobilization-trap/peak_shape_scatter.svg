<svg viewBox="0 0 1120 740" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Scatter chart plotting years from launch to all-time concurrent peak against current concurrency as a share of that peak, for 21 games">
  <title>Peak shape does not cleanly predict retention</title>

  <rect x="0" y="0" width="1120" height="740" fill="#F7F4EE"/>
  <rect x="0" y="0" width="1120" height="3" fill="#232323"/>

  <!-- Header -->
  <text x="60" y="54" font-family="'Playfair Display',Georgia,serif" font-size="28" fill="#232323">Peak shape does not cleanly predict retention</text>
  <text x="60" y="80" font-family="'Playfair Display',Georgia,serif" font-size="16" font-style="italic" fill="#C3A55F">Four quadrants, and every one of them is occupied</text>
  <text x="1060" y="54" font-family="'DM Sans',Helvetica,Arial,sans-serif" font-size="15" letter-spacing="6" fill="#C3A55F" text-anchor="end">▲▲▲▲</text>

  <!-- Axis frame -->
  <line x1="130" y1="130" x2="130" y2="580" stroke="#232323" stroke-width="1.4"/>
  <line x1="130" y1="580" x2="1070" y2="580" stroke="#232323" stroke-width="1.4"/>

  <!-- Gridlines -->
  <g stroke="#D2CDC3" stroke-width="1" stroke-dasharray="2 4">
    <line x1="130" y1="452.4" x2="1070" y2="452.4"/>
    <line x1="130" y1="324.9" x2="1070" y2="324.9"/>
    <line x1="130" y1="197.3" x2="1070" y2="197.3"/>
  </g>
  <g font-family="'IBM Plex Mono',monospace" font-size="11" fill="#6B6660" text-anchor="end">
    <text x="118" y="584">0%</text>
    <text x="118" y="456">10%</text>
    <text x="118" y="329">20%</text>
    <text x="118" y="201">30%</text>
  </g>

  <!-- X ticks -->
  <g font-family="'IBM Plex Mono',monospace" font-size="11" fill="#6B6660" text-anchor="middle">
    <text x="130" y="601">0</text>
    <text x="287" y="601">2</text>
    <text x="443" y="601">4</text>
    <text x="600" y="601">6</text>
    <text x="757" y="601">8</text>
    <text x="913" y="601">10</text>
    <text x="1070" y="601">12</text>
  </g>
  <g stroke="#BAB9B4" stroke-width="1">
    <line x1="287" y1="580" x2="287" y2="586"/>
    <line x1="443" y1="580" x2="443" y2="586"/>
    <line x1="600" y1="580" x2="600" y2="586"/>
    <line x1="757" y1="580" x2="757" y2="586"/>
    <line x1="913" y1="580" x2="913" y2="586"/>
  </g>

  <text x="600" y="626" font-family="'DM Sans',Helvetica,Arial,sans-serif" font-size="12.5" fill="#232323" text-anchor="middle">Years from launch to all-time concurrent peak</text>
  <text x="38" y="355" font-family="'DM Sans',Helvetica,Arial,sans-serif" font-size="12.5" fill="#232323" text-anchor="middle" transform="rotate(-90 38 355)">Current concurrency as a share of all-time peak</text>

  <!-- 10% retention reference -->
  <line x1="130" y1="452.4" x2="1070" y2="452.4" stroke="#C3A55F" stroke-width="1.2" stroke-dasharray="6 5"/>
  <text x="140" y="446" font-family="'IBM Plex Mono',monospace" font-size="10" fill="#C3A55F">10% OF PEAK RETAINED</text>

  <!-- Counter-case cluster -->
  <ellipse cx="147" cy="571" rx="34" ry="15" fill="none" stroke="#BAB9B4" stroke-width="1" stroke-dasharray="3 3"/>
  <g fill="none" stroke="#6B6660" stroke-width="1.1" opacity="0.9">
    <circle cx="132" cy="577" r="4"/>
    <circle cx="141" cy="579" r="4"/>
    <circle cx="170" cy="579" r="4"/>
    <circle cx="150" cy="576" r="4"/>
    <circle cx="134" cy="570" r="4"/>
    <circle cx="143" cy="566" r="4"/>
    <circle cx="158" cy="571" r="4"/>
    <circle cx="151" cy="566" r="4"/>
    <circle cx="164" cy="575" r="4"/>
    <circle cx="136" cy="564" r="4"/>
    <circle cx="147" cy="573" r="4"/>
    <circle cx="159" cy="565" r="4"/>
  </g>

  <!-- Counter-case annotation, lifted into clear space -->
  <line x1="326" y1="514" x2="183" y2="560" stroke="#BAB9B4" stroke-width="1"/>
  <text x="334" y="486" font-family="'DM Sans',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#232323">Twelve counter-cases, all in one corner</text>
  <text x="334" y="504" font-family="'DM Sans',Helvetica,Arial,sans-serif" font-size="11" fill="#6B6660">Worlds Adrift, Dual Universe, Atlas, Stormgate, Nightingale, KSP2,</text>
  <text x="334" y="519" font-family="'DM Sans',Helvetica,Arial,sans-serif" font-size="11" fill="#6B6660">Spellbreak, Starbase, Ashes, Life is Feudal, Rend, Last Oasis.</text>
  <text x="334" y="537" font-family="'IBM Plex Mono',monospace" font-size="10" fill="#6B6660">EVERY ONE BELOW 0.5% OF PEAK. ELEVEN SHIPPED AN AUTHORING LAYER.</text>

  <!-- Survivors: late peak -->
  <g fill="#C3A55F">
    <circle cx="820" cy="215" r="7.5"/>
    <circle cx="866" cy="127" r="7.5"/>
    <circle cx="836" cy="304" r="7.5"/>
    <circle cx="1002" cy="406" r="7.5"/>
    <circle cx="627" cy="475" r="7.5"/>
  </g>
  <g font-family="'DM Sans',Helvetica,Arial,sans-serif" font-size="12.5" fill="#232323">
    <text x="834" y="212">Warframe</text>
    <text x="880" y="124">RimWorld</text>
    <text x="850" y="301">Factorio</text>
    <text x="988" y="400" text-anchor="end">Path of Exile</text>
    <text x="641" y="472">Deep Rock Galactic</text>
  </g>
  <g font-family="'IBM Plex Mono',monospace" font-size="10" fill="#6B6660">
    <text x="834" y="226">+8.3y · 26% · 48,852</text>
    <text x="880" y="138">+9.0y · 32% · 31,008</text>
    <text x="850" y="315">+8.7y · 19% · 22,697</text>
    <text x="988" y="414" text-anchor="end">+10.8y · 12%* · 26,480</text>
    <text x="641" y="486">+6.3y · 6% · 3,393 players</text>
  </g>

  <!-- Launch-peak points -->
  <g fill="#232323">
    <circle cx="134" cy="306" r="7.5"/>
    <circle cx="326" cy="224" r="7.5"/>
    <circle cx="280" cy="566" r="7.5"/>
    <circle cx="134" cy="512" r="7.5"/>
  </g>
  <g font-family="'DM Sans',Helvetica,Arial,sans-serif" font-size="12.5" fill="#232323">
    <text x="148" y="303">Helldivers 2</text>
    <text x="340" y="221">Overwatch 2</text>
    <text x="294" y="563">Battlefield 2042</text>
    <text x="148" y="509">Valheim</text>
  </g>
  <g font-family="'IBM Plex Mono',monospace" font-size="10" fill="#6B6660">
    <text x="148" y="317">+16d · 19% · 87,862 players</text>
    <text x="340" y="235">+2.5y · 25% · 41,594</text>
    <text x="294" y="577">+1.9y · 1.1% · 1,225</text>
    <text x="148" y="523">+19d · 3.7% · 18,440</text>
  </g>

  <!-- Callout 1: Helldivers 2 -->
  <line x1="352" y1="272" x2="352" y2="292" stroke="#C3A55F" stroke-width="1"/>
  <line x1="352" y1="292" x2="318" y2="292" stroke="#C3A55F" stroke-width="1"/>
  <text x="360" y="268" font-family="'DM Sans',Helvetica,Arial,sans-serif" font-size="11.5" font-style="italic" fill="#C3A55F">Largest current playerbase in the whole sample.</text>
  <text x="360" y="284" font-family="'DM Sans',Helvetica,Arial,sans-serif" font-size="11.5" font-style="italic" fill="#C3A55F">The report classifies it as a counter-case.</text>

  <!-- Callout 2: Battlefield 2042 -->
  <line x1="452" y1="566" x2="428" y2="566" stroke="#C3A55F" stroke-width="1"/>
  <text x="460" y="554" font-family="'DM Sans',Helvetica,Arial,sans-serif" font-size="11.5" font-style="italic" fill="#C3A55F">Peak arrived two years late and it died anyway.</text>
  <text x="460" y="570" font-family="'DM Sans',Helvetica,Arial,sans-serif" font-size="11.5" font-style="italic" fill="#C3A55F">Portal shipped day one. The rule has an exception.</text>

  <!-- Legend -->
  <g transform="translate(130,655)">
    <circle cx="6" cy="-4" r="6" fill="#C3A55F"/>
    <text x="22" y="0" font-family="'DM Sans',Helvetica,Arial,sans-serif" font-size="11.5" fill="#232323">Peak arrived years after launch</text>
    <circle cx="262" cy="-4" r="6" fill="#232323"/>
    <text x="278" y="0" font-family="'DM Sans',Helvetica,Arial,sans-serif" font-size="11.5" fill="#232323">Peak arrived at launch</text>
    <circle cx="470" cy="-4" r="5" fill="none" stroke="#6B6660" stroke-width="1.1"/>
    <text x="486" y="0" font-family="'DM Sans',Helvetica,Arial,sans-serif" font-size="11.5" fill="#232323">Counter-case</text>
  </g>

  <text x="130" y="681" font-family="'DM Sans',Helvetica,Arial,sans-serif" font-size="11" fill="#6B6660">*Path of Exile reads at a 13-week league trough. Its July 2026 monthly peak was 187,116.</text>

  <!-- Source -->
  <line x1="130" y1="697" x2="1070" y2="697" stroke="#D2CDC3" stroke-width="1"/>
  <text x="130" y="714" font-family="'IBM Plex Mono',monospace" font-size="9.5" fill="#6B6660">SOURCE: STEAMDB CONCURRENT SERIES, READ 23 AUG 2026. STEAM-ONLY FIGURES.</text>
  <text x="130" y="727" font-family="'IBM Plex Mono',monospace" font-size="9.5" fill="#6B6660">OSRS AND HYTALE EXCLUDED: PEAK AND CURRENT COME FROM DIFFERENT CLIENT POPULATIONS.</text>
  <text x="1070" y="714" font-family="'IBM Plex Mono',monospace" font-size="9.5" fill="#C3A55F" text-anchor="end">LLAMA &amp; GRIFFIN</text>
</svg>
